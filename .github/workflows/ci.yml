name: CI
on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8.0.43
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
        ports:
          - 33077:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s --health-timeout=5s --health-retries=12
    env:
      TEST_MYSQL_CONNECTION_STRING: Server=127.0.0.1;Port=33077;User ID=root;SslMode=None
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 9.0.x
      - run: dotnet build backend/src/EmailBlastCommunicationServices.sln -c Release
      - name: Testes unitários, arquitetura e integração MySQL
        run: dotnet test backend/src/EmailBlastCommunicationServices.sln -c Release --no-build --logger trx --results-directory TestResults
      - name: Publicar API sem configurações locais
        shell: bash
        run: |
          set -euo pipefail
          dotnet publish backend/src/EmailBlastCommunicationServices.Api -c Release --no-build -o artifacts/api
          find artifacts/api -name 'appsettings*.json' -delete
          test -s artifacts/api/EmailBlastCommunicationServices.Api.dll
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: emailblast-test-results
          path: TestResults
          retention-days: 7
      - uses: actions/upload-artifact@v6
        with:
          name: emailblast-api
          path: artifacts/api
          if-no-files-found: error
          retention-days: 7
  deployment-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - run: bash -n deploy/deploy.sh && bash -n deploy/prepare-vm.sh
      - run: shellcheck deploy/deploy.sh deploy/prepare-vm.sh
      - name: Validar preparacao Python
        run: python3 -m py_compile deploy/prepare-vm.py
